<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>RIVA EARN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#101827;--panel:#1c293b;--gold:#ffd166;--text:#f8fafc;--muted:#b6c2d2;--green:#20b26b;--blue:#2e90e8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#101827,#0b1220);color:var(--text);font:16px system-ui,sans-serif}.wrap{max-width:560px;margin:auto;padding:16px 14px 34px}.brand{text-align:center;padding:12px 0 18px}.logo{width:68px;height:68px;margin:auto auto 8px;border-radius:20px;background:linear-gradient(145deg,#ffe08a,#a66b00);display:grid;place-items:center;color:#111827;font-weight:900;border:3px solid #fff0b8}.brand h1{margin:4px 0;color:var(--gold)}.muted,.note{color:var(--muted)}select,input{width:100%;background:#111c2c;color:white;border:1px solid #40516b;border-radius:11px;padding:12px;margin:5px 0 10px}.card{background:var(--panel);border:1px solid #2b3a50;border-radius:16px;padding:16px;margin:12px 0}.amount{font-size:30px;color:var(--gold);font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{width:100%;border:0;border-radius:12px;background:#293950;color:white;padding:13px 10px;text-align:left;font-weight:700;margin:4px 0;cursor:pointer}.btn span{font-size:21px;display:block;margin-bottom:5px}.primary{background:var(--green);color:#071b11;text-align:center}.blue{background:var(--blue);text-align:center}.section{margin-top:18px}.hidden{display:none}.row{display:flex;gap:8px}.row>*{flex:1}.small{font-size:12px;line-height:1.45}.status{padding:8px;border-radius:8px;background:#111c2c;margin:7px 0;white-space:pre-wrap}.item{padding:10px 0;border-bottom:1px solid #35445a}.item:last-child{border-bottom:0}button:disabled{opacity:.5}.alert{padding:10px;border-radius:10px;margin:10px 0;background:#283a4f}.danger{color:#ffd166}
</style></head><body><main class="wrap">
<header class="brand"><div class="logo">RIVA<br>EARN</div><h1>RIVA EARN 💰</h1><div class="muted" id="tagline">Invite friends. Earn rewards.</div></header>
<label id="languageLabel" for="language">Language / ቋንቋ / Afaan</label><select id="language"><option value="en">🇬🇧 English</option><option value="am">🇪🇹 አማርኛ</option><option value="om">🌳 Afaan Oromoo</option></select>
<div id="message" class="alert hidden"></div>
<section class="card"><div id="balanceLabel" class="muted">Your balance</div><div class="amount" id="balance">— ETB</div><div class="small muted" id="balanceNote">Live account balance from the server.</div></section>
<div class="grid">
<button class="btn" onclick="loadAccount()"><span>👤</span><b id="accountBtn">My Account</b></button>
<button class="btn" onclick="claimBonus()"><span>🎁</span><b id="bonusBtn">Daily Bonus</b></button>
<button class="btn" onclick="loadTasks()"><span>📋</span><b id="tasksBtn">Tasks</b></button>
<button class="btn" onclick="loadInvite()"><span>👥</span><b id="inviteBtn">Invite Friends</b></button>
<button class="btn" onclick="showWithdraw()"><span>💳</span><b id="withdrawBtn">Withdraw</b></button>
<button class="btn" onclick="loadHistory()"><span>📊</span><b id="historyBtn">History</b></button>
<button class="btn" onclick="loadHelp()"><span>🆘</span><b id="helpBtn">Help & Support</b></button>
<button id="adminBtn" class="btn hidden" onclick="loadAdmin()"><span>👑</span><b>Admin panel</b></button>
</div>
<section class="card section hidden" id="detail"><h3 id="detailTitle"></h3><div id="detailBody"></div></section>
<footer class="small muted" style="text-align:center;margin-top:22px">RIVA EARN • ETB rewards are subject to verification and administrator approval.</footer>
</main>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const initData=tg?.initData||'';
let me=null, lang='en';
const tr={
en:{tagline:'Invite friends. Earn rewards.',languageLabel:'Choose language',balanceLabel:'Your balance',balanceNote:'ETB balance recorded by the server.',accountBtn:'My Account',bonusBtn:'Daily Bonus',tasksBtn:'Available Tasks',inviteBtn:'Invite Friends',withdrawBtn:'Withdraw',historyBtn:'History',helpBtn:'Help & Support',claim:'Claim daily bonus',claimed:'Already claimed today',request:'Submit request',amount:'Amount (ETB)',method:'Payment method',account:'Receiving phone/account details',submit:'Submit',back:'Back',none:'Nothing to show yet.',loading:'Loading…',error:'Error',accountTitle:'My Account',tasksTitle:'Available Tasks',inviteTitle:'Invite Friends',withdrawTitle:'Withdrawal request',historyTitle:'Transaction history',helpTitle:'Help & Support',noTasks:'No tasks available right now.',copy:'Copy invite link',review:'For safety, withdrawal requests are reviewed by the administrator. This app does not send money automatically.'},
am:{tagline:'ጓደኞችን ይጋብዙ፤ ሽልማት ያግኙ።',languageLabel:'ቋንቋ ይምረጡ',balanceLabel:'ቀሪ ሂሳብዎ',balanceNote:'የETB ሂሳብ በሰርቨሩ ይመዘገባል።',accountBtn:'የእኔ መለያ',bonusBtn:'ዕለታዊ ሽልማት',tasksBtn:'ተግባራት',inviteBtn:'ጓደኞችን ጋብዝ',withdrawBtn:'ገንዘብ ማውጣት',historyBtn:'ታሪክ',helpBtn:'እርዳታ',claim:'ዕለታዊ ሽልማት ውሰድ',claimed:'ዛሬ ተወስዷል',request:'ጥያቄ ላክ',amount:'መጠን (ETB)',method:'የክፍያ ዘዴ',account:'የስልክ/ሂሳብ መረጃ',submit:'ላክ',back:'ተመለስ',none:'ምንም የለም።',loading:'በመጫን ላይ…',error:'ስህተት',accountTitle:'የእኔ መለያ',tasksTitle:'ተግባራት',inviteTitle:'ጓደኞችን ጋብዝ',withdrawTitle:'የገንዘብ ማውጣት ጥያቄ',historyTitle:'የግብይት ታሪክ',helpTitle:'እርዳታ',noTasks:'አሁን ተግባር የለም።',copy:'የግብዣ ሊንክ ቅዳ',review:'የማውጣት ጥያቄዎች በአስተዳዳሪ ይገመገማሉ። አፑ በራሱ ገንዘብ አይልክም።'},
om:{tagline:'Hiriyoota affeeri. Badhaasa argadhu.',languageLabel:'Afaan filadhu',balanceLabel:'Baalansii kee',balanceNote:'Baalansiin ETB server irratti galmaa’a.',accountBtn:'Herrega Koo',bonusBtn:'Badhaasa Guyyaa',tasksBtn:'Hojiiwwan',inviteBtn:'Hiriyoota Afeeri',withdrawBtn:'Kaffaltii Baasuu',historyBtn:'Seenaa',helpBtn:'Gargaarsa',claim:'Badhaasa guyyaa fudhadhu',claimed:'Har’a duraan fudhatteetta',request:'Gaaffii ergi',amount:'Hamma (ETB)',method:'Karaa kaffaltii',account:'Lakkoofsa bilbilaa/herregaa',submit:'Ergi',back:'Duubatti',none:'Amma homtuu hin jiru.',loading:'Fe’aa jira…',error:'Dogoggora',accountTitle:'Herrega Koo',tasksTitle:'Hojiiwwan Jiran',inviteTitle:'Hiriyoota Afeeri',withdrawTitle:'Gaaffii kaffaltii baasuu',historyTitle:'Seenaa kaffaltii',helpTitle:'Gargaarsa',noTasks:'Amma hojii hin jiru.',copy:'Linkii affeerraa kooppii godhi',review:'Gaaffiin kaffaltii baasuu adminiin ilaalama. Appiin kun ofumaan maallaqa hin ergu.'}
};
function t(k){return tr[lang][k]||tr.en[k]||k}
function msg(s){const e=document.getElementById('message');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),5000)}
function section(title,html){document.getElementById('detailTitle').textContent=title;document.getElementById('detailBody').innerHTML=html;document.getElementById('detail').classList.remove('hidden');document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'nearest'})}
async function api(path,opts={}){if(!initData)throw new Error('Open this Mini App from Telegram, not a regular browser.');const r=await fetch('/api'+path,{...opts,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData,...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}
function applyLang(){lang=document.getElementById('language').value;for(const id of ['tagline','languageLabel','balanceLabel','balanceNote','accountBtn','bonusBtn','tasksBtn','inviteBtn','withdrawBtn','historyBtn','helpBtn'])document.getElementById(id).textContent=t(id);api('/language',{method:'POST',body:JSON.stringify({language:lang})}).catch(()=>{});}
async function refresh(){try{const d=await api('/me');me=d;document.getElementById('balance').textContent=Number(d.user.balance).toFixed(2)+' ETB';document.getElementById('language').value=d.user.language||'en';lang=d.user.language||'en';applyLang();if(d.isAdmin)document.getElementById('adminBtn').classList.remove('hidden');}catch(e){document.getElementById('balance').textContent='— ETB';msg(e.message)}}
document.getElementById('language').addEventListener('change',applyLang);
async function claimBonus(){try{const d=await api('/bonus',{method:'POST',body:'{}'});msg('+'+Number(d.amount).toFixed(2)+' ETB');await refresh()}catch(e){msg(e.message)}}
async function loadAccount(){try{const d=await api('/me');section(t('accountTitle'),`<p>${escapeHtml(d.user.first_name||'')} ${d.user.username?'(@'+escapeHtml(d.user.username)+')':''}</p><p>${t('balanceLabel')}: <b>${Number(d.user.balance).toFixed(2)} ETB</b></p><p class="small">${t('review')}</p>`)}catch(e){msg(e.message)}}
async function loadTasks(){try{const d=await api('/tasks');section(t('tasksTitle'),d.tasks.length?d.tasks.map(x=>`<div class="item"><b>${escapeHtml(x.title)}</b><p>${escapeHtml(x.description||'')}<br>Reward: ${Number(x.reward).toFixed(2)} ETB · ${escapeHtml(x.status)}</p>${x.status==='available'?`<button class="btn blue" onclick="completeTask(${x.id})">${t('submit')}</button>`:''}</div>`).join(''):t('noTasks'))}catch(e){msg(e.message)}}
async function completeTask(id){try{const d=await api('/tasks/'+id+'/complete',{method:'POST',body:'{}'});msg(d.message);loadTasks()}catch(e){msg(e.message)}}
async function loadInvite(){try{const d=await api('/invite');section(t('inviteTitle'),`<p>Referrals: <b>${d.referrals}</b></p><input id="inviteLink" readonly value="${escapeHtml(d.link)}"><button class="btn primary" onclick="copyInvite()">${t('copy')}</button>`)}catch(e){msg(e.message)}}
async function copyInvite(){const el=document.getElementById('inviteLink');try{await navigator.clipboard.writeText(el.value);msg('Copied')}catch{el.select();document.execCommand('copy');msg('Copied')}}
function showWithdraw(){section(t('withdrawTitle'),`<p>${t('review')}</p><label>${t('amount')}</label><input id="withdrawAmount" type="number" min="1" step="0.01" placeholder="10.00"><label>${t('method')}</label><select id="withdrawMethod"><option>Telebirr</option><option>CBE</option><option>CBE Birr</option></select><label>${t('account')}</label><input id="withdrawAccount" maxlength="200" placeholder="09…"><button class="btn primary" onclick="submitWithdraw()">${t('request')}</button>`)}
async function submitWithdraw(){try{const d=await api('/withdraw',{method:'POST',body:JSON.stringify({amount:Number(document.getElementById('withdrawAmount').value),method:document.getElementById('withdrawMethod').value,accountDetail:document.getElementById('withdrawAccount').value})});msg('Request #'+d.requestId+' submitted');await refresh()}catch(e){msg(e.message)}}
async function loadHistory(){try{const d=await api('/history');section(t('historyTitle'),d.transactions.length?d.transactions.map(x=>`<div class="item"><b>${escapeHtml(x.type)}</b> · ${Number(x.amount).toFixed(2)} ETB<br><span class="small muted">${escapeHtml(x.status)} · ${escapeHtml(x.created_at)}<br>${escapeHtml(x.note||'')}</span></div>`).join(''):t('none'))}catch(e){msg(e.message)}}
function loadHelp(){section(t('helpTitle'),`<p>${t('review')}</p><p>Admin: @solosanX</p><p class="small">Do not share Telegram login codes or passwords with anyone.</p>`)}
async function loadAdmin(){try{const d=await api('/admin/overview');section('Admin panel',`<p>Registered users: <b>${d.users}</b></p><p>Total recorded balance: <b>${Number(d.totalBalance).toFixed(2)} ETB</b></p><p>Pending withdrawals: <b>${d.pendingWithdrawals}</b></p><p>Pending task submissions: <b>${d.pendingTasks}</b></p><button class="btn blue" onclick="adminWithdrawals()">Review withdrawals</button><h4>Create task</h4><input id="taskTitle" placeholder="Task title (English)"><input id="taskAm" placeholder="Task title (Amharic)"><input id="taskOm" placeholder="Task title (Afaan Oromoo)"><input id="taskDesc" placeholder="Description"><input id="taskReward" type="number" placeholder="Reward ETB"><button class="btn primary" onclick="createTask()">Create task</button>`)}catch(e){msg(e.message)}}
async function adminWithdrawals(){try{const d=await api('/admin/withdrawals');section('Review withdrawals',d.withdrawals.length?d.withdrawals.map(w=>`<div class="item">#${w.id} · ${Number(w.amount).toFixed(2)} ETB<br>${escapeHtml(w.method)} · ${escapeHtml(w.account_detail)}<br>${escapeHtml(w.first_name||'')} @${escapeHtml(w.username||'')} · ${escapeHtml(w.status)}<br>${w.status==='pending'?`<button onclick="reviewWithdrawal(${w.id},'paid')">Mark paid</button><button onclick="reviewWithdrawal(${w.id},'rejected')">Reject & refund</button>`:''}</div>`).join(''):t('none'))}catch(e){msg(e.message)}}
async function reviewWithdrawal(id,decision){try{await api('/admin/withdrawals/'+id+'/review',{method:'POST',body:JSON.stringify({decision})});msg('Updated');adminWithdrawals()}catch(e){msg(e.message)}}
async function createTask(){try{await api('/admin/tasks',{method:'POST',body:JSON.stringify({title:document.getElementById('taskTitle').value,titleAm:document.getElementById('taskAm').value,titleOm:document.getElementById('taskOm').value,description:document.getElementById('taskDesc').value,reward:Number(document.getElementById('taskReward').value)})});msg('Task created');loadAdmin()}catch(e){msg(e.message)}}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
refresh();
</script></body></html>
